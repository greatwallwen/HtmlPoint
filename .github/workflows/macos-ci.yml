name: macOS CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS single-screen baseline
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/helper/pyproject.toml

      - name: Install Python Helper
        run: python -m pip install -e "platform/helper[dev]"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      - name: Install Web dependencies
        run: npm --prefix platform/web ci

      - name: Run Python QA tests
        run: python -m pytest platform/qa/test_run.py platform/qa/test_start_course_studio.py -q

      - name: Run offline cross-platform Helper tests
        run: >-
          python -m pytest platform/helper/tests
          -m "not reference_demo and not network_visual and not model_download and not projection_integration and not projection_hardware"
          -q

      - name: Run Web unit tests
        run: >-
          npm --prefix platform/web test --
          --run
          --exclude "**/*.projection-integration.test.ts"

      - name: Typecheck Web application
        run: npm --prefix platform/web run typecheck

      - name: Build Web application
        run: npm --prefix platform/web run build
