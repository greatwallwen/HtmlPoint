  - heading "2. 打开空白页（一）：浏览器打开太早" [level=2] [ref=e89]
  - heading "现象" [level=3] [ref=e90]
  - paragraph [ref=e91]: 启动后浏览器打开是空白页。
  - heading "原因" [level=3] [ref=e92]
  - paragraph [ref=e93]:
    - code [ref=e94]: server.py
    - text: 在
    - code [ref=e95]: uvicorn.run()
    - strong [ref=e96]: 之前
    - text: 就调用了
    - code [ref=e97]: open_browser()
    - text: 。浏览器打开时服务器还没启动，连接失败。用户手动刷新后 URL 丢失了
    - code [ref=e98]: "#helper=...&nonce=..."
    - text: fragment，前端显示"请从课程工作台启动"。
  - code [ref=e100]: "旧流程: open_browser() → uvicorn.run() ← 浏览器先打开，服务器还没启动"
  - heading "修复" [level=3] [ref=e101]
  - paragraph [ref=e102]:
    - strong [ref=e103]:
      - text: 文件：
      - code [ref=e104]: platform/helper/course_helper/server.py
  - list [ref=e105]:
    - listitem [ref=e106]:
      - text: 将
      - code [ref=e107]: uvicorn.run()
      - text: 改为后台线程启动，用
      - code [ref=e108]: _wait_for_loopback()
      - text: 轮询端口直到服务器就绪，
      - strong [ref=e109]: 然后再
      - text: 调用
      - code [ref=e110]: open_browser()
    - listitem [ref=e111]:
      - text: 新增
      - code [ref=e112]: _wait_for_loopback()
      - text: 函数：用 socket 轮询 127.0.0.1 端口，最多等待 10 秒确认服务器已就绪
    - listitem [ref=e113]:
      - text: 控制台打印连接 URL：服务器就绪后在 stderr 打印
      - code [ref=e114]: "course-helper: open http://127.0.0.1:8765/#helper=...&nonce=..."
      - text: ，即使浏览器没自动打开，也可以从控制台复制这个 URL 手动访问
    - listitem [ref=e115]:
      - text: 浏览器启动失败不再终止服务器：如果
      - code [ref=e116]: webbrowser.open()
      - text: 失败，服务器继续运行
  - code [ref=e118]: "新流程: 后台启动 uvicorn → 等待端口就绪 → 打印连接 URL → open_browser()"
  - separator [ref=e119]
  - heading "3. 打开空白页（二）：JS MIME 类型错误" [level=2] [ref=e120]
  - heading "现象" [level=3] [ref=e121]
  - paragraph [ref=e122]: 启动后页面仍然空白。
  - heading "原因" [level=3] [ref=e123]
  - paragraph [ref=e124]:
    - text: JS 文件的
    - code [ref=e125]: Content-Type
    - text: 是
    - code [ref=e126]: text/plain; charset=utf-8
    - text: ，而不是
    - code [ref=e127]: application/javascript
    - text: 。浏览器会拒绝执行 MIME 类型为
    - code [ref=e128]: text/plain
    - text: 的
    - code [ref=e129]: <script type="module">
    - text: ，导致页面完全空白。
  - paragraph [ref=e130]:
    - text: 这是 Windows 上 Python
    - code [ref=e131]: mimetypes
    - text: 模块的已知问题——它从注册表读取 MIME 类型，而某些 Windows 安装中
    - code [ref=e132]: .js
    - text: 被映射为
    - code [ref=e133]: text/plain
    - text: 。
  - heading "修复" [level=3] [ref=e134]
  - paragraph [ref=e135]:
    - strong [ref=e136]:
      - text: 文件：
      - code [ref=e137]: platform/helper/course_helper/static_web.py
  - paragraph [ref=e138]: 在挂载静态文件前纠正 MIME 类型：
  - code [ref=e140]: mimetypes.add_type("application/javascript", ".js") mimetypes.add_type("application/javascript", ".mjs") mimetypes.add_type("text/css", ".css")
  - paragraph [ref=e141]:
    - text: 修复前后对比： - 修复前：
    - code [ref=e142]: "Content-Type: text/plain; charset=utf-8"
    - text: → 浏览器拒绝执行 → 空白页 - 修复后：
    - code [ref=e143]: "Content-Type: application/javascript"
    - text: → 浏览器正常执行 → 页面渲染
  - separator [ref=e144]
  - heading "4. 打开空白页（三）：浏览器缓存 + fragment 丢失" [level=2] [ref=e145]
  - heading "现象" [level=3] [ref=e146]
  - paragraph [ref=e147]: MIME 类型修复后页面仍然空白。
  - heading "原因" [level=3] [ref=e148]
  - paragraph [ref=e149]: 两个问题同时存在：
  - list [ref=e150]:
    - listitem [ref=e151]:
      - strong [ref=e152]: 浏览器缓存
      - text: ：浏览器缓存了旧的
      - code [ref=e153]: text/plain
      - text: JS 响应，即使服务器已修复 MIME 类型，浏览器仍使用缓存
    - listitem [ref=e154]:
      - strong [ref=e155]: fragment 丢失
      - text: ：浏览器打开时 URL fragment（
      - code [ref=e156]: "#helper=...&nonce=..."
      - text: ）可能丢失，导致前端 session 握手失败，显示"请从课程工作台启动"
  - heading "修复" [level=3] [ref=e157]
  - paragraph [ref=e158]:
    - strong [ref=e159]: 1. 浏览器缓存旧响应
    - text: (
    - code [ref=e160]: static_web.py
    - text: )
  - list [ref=e161]:
    - listitem [ref=e162]:
      - text: 添加
      - code [ref=e163]: "Cache-Control: no-store"
      - text: 头，强制浏览器每次获取最新文件
  - paragraph [ref=e164]:
    - strong [ref=e165]: 2. URL fragment 丢失导致 session 握手失败
    - text: (
    - code [ref=e166]: session.py
    - text: +
    - code [ref=e167]: api.py
    - text: )
  - list [ref=e168]:
    - listitem [ref=e169]:
      - text: 新增
      - code [ref=e170]: /v1/session/same-origin
      - text: 端点，允许同源 SPA 无需 nonce 直接获取 session token
    - listitem [ref=e171]:
      - text: 安全性：服务器只监听
      - code [ref=e172]: 127.0.0.1
      - text: ，同源请求只能来自 SPA 本身
  - paragraph [ref=e173]:
    - strong [ref=e174]: 3. 前端 fragment 丢失时自动恢复
    - text: (
    - code [ref=e175]: helper-session.ts
    - text: )
  - list [ref=e176]:
    - listitem [ref=e177]: 当 fragment 丢失时，自动尝试同源建立 session，不再显示"请从课程工作台启动"
  - separator [ref=e178]
  - heading "5. 课程创建失败：timestamp 格式不匹配" [level=2] [ref=e179]
  - heading "现象" [level=3] [ref=e180]
  - paragraph [ref=e181]: 上传 markdown 文件后输入课程要求，显示"课程创建未能开始，请检查资料后重试。"
  - heading "原因" [level=3] [ref=e182]
  - paragraph [ref=e183]:
    - text: 前端创建课程时需要计算一个
    - code [ref=e184]: requestDigest
    - text: （SHA-256 哈希），后端用同样的算法验证。但两边的 timestamp 序列化格式不一致：
  - table [ref=e185]:
    - rowgroup [ref=e186]:
      - row [ref=e187]:
        - columnheader "输入" [ref=e188]
        - columnheader "前端产生" [ref=e189]
        - columnheader "后端 Pydantic 产生" [ref=e190]
        - columnheader "匹配？" [ref=e191]
    - rowgroup [ref=e192]:
      - row [ref=e193]:
        - cell [ref=e194]:
          - code [ref=e195]: 12:00:00.000Z
        - cell [ref=e196]:
          - code [ref=e197]: 12:00:00.000000Z
        - cell [ref=e198]:
          - code [ref=e199]: 12:00:00Z
        - cell [ref=e200]:
          - strong [ref=e201]: 不匹配
      - row [ref=e202]:
        - cell [ref=e203]:
          - code [ref=e204]: 12:00:00.123Z
        - cell [ref=e205]:
          - code [ref=e206]: 12:00:00.123000Z
        - cell [ref=e207]:
          - code [ref=e208]: 12:00:00.123000Z
        - cell "匹配" [ref=e209]
  - paragraph [ref=e210]:
    - code [ref=e211]: new Date().toISOString()
    - text: 绝大多数时候产生
    - code [ref=e212]: .000Z
    - text: （零毫秒），前端旧代码把它变成
    - code [ref=e213]: .000000Z
    - text: ，但后端 Pydantic 把零微秒的时间戳序列化成
    - code [ref=e214]: Z
    - text: （去掉小数部分）。格式不同 → SHA-256 哈希不同 → 后端返回 422 → 前端显示通用错误。
  - heading "修复" [level=3] [ref=e215]
  - table [ref=e216]:
    - rowgroup [ref=e217]:
      - row [ref=e218]:
        - columnheader "文件" [ref=e219]
        - columnheader "改动" [ref=e220]
    - rowgroup [ref=e221]:
      - row [ref=e222]:
        - cell [ref=e223]:
          - code [ref=e224]: governed-job-factory.ts
        - cell [ref=e225]:
          - text: 修复
          - code [ref=e226]: helperCanonicalTimestamp
          - text: ，匹配 Pydantic 的序列化规则：零微秒时去掉小数部分，非零时补齐到 6 位
      - row [ref=e227]:
        - cell [ref=e228]:
          - code [ref=e229]: knowledge-client.ts
        - cell "改进错误处理，不再吞掉所有错误细节，显示 HTTP 状态码和响应体" [ref=e230]
      - row [ref=e231]:
        - cell [ref=e232]:
          - code [ref=e233]: PersonalCourseCreate.tsx
        - cell "错误信息从通用的\"请检查资料后重试\"改为显示具体错误原因" [ref=e234]
  - separator [ref=e235]
  - heading "6. 中文文件名报错：HTTP header 编码限制" [level=2] [ref=e236]
  - heading "现象" [level=3] [ref=e237]
  - paragraph [ref=e238]:
    - text: 上传文件名为
    - code [ref=e239]: AIGC实操-Prompt工程.md
    - text: 的文件后报错：
  - code [ref=e241]: "课程创建未能开始：本地知识服务暂不可用（Failed to execute 'fetch' on 'Window': Failed to read the 'headers' property from 'RequestInit': String contains non ISO-8859-1 code point.）"
  - heading "原因" [level=3] [ref=e242]
  - paragraph [ref=e243]:
    - text: 浏览器 fetch API 规定：
    - strong [ref=e244]: header 值只能包含 ISO-8859-1 字符
    - text: （基本就是 ASCII），中文会被直接拒绝。文件名中的中文被直接放进了
    - code [ref=e245]: X-Upload-Name
    - text: header。
  - heading "修复" [level=3] [ref=e246]
  - table [ref=e247]:
    - rowgroup [ref=e248]:
      - row [ref=e249]:
        - columnheader "文件" [ref=e250]
        - columnheader "改动" [ref=e251]
    - rowgroup [ref=e252]:
      - row [ref=e253]:
        - cell [ref=e254]:
          - code [ref=e255]: knowledge-client.ts
        - cell [ref=e256]:
          - code [ref=e257]: X-Upload-Name
          - text: 值用
          - code [ref=e258]: encodeURIComponent(fileName)
          - text: 编码
      - row [ref=e259]:
        - cell [ref=e260]:
          - code [ref=e261]: api.py
        - cell [ref=e262]:
          - text: 后端用
          - code [ref=e263]: unquote(names[0])
          - text: 解码，还原原始中文文件名
  - paragraph [ref=e264]:
    - text: 纯 ASCII 文件名（如
    - code [ref=e265]: test.md
    - text: ）不受影响——
    - code [ref=e266]: encodeURIComponent
    - text: 和
    - code [ref=e267]: unquote
    - text: 对纯 ASCII 是恒等操作。
  - separator [ref=e268]
  - heading "7. 创建未完成：extraction evidence 状态判断" [level=2] [ref=e269]
  - heading "现象" [level=3] [ref=e270]
  - paragraph [ref=e271]: 上传文件后显示 10 项建议，接受后显示"创建未完成：资料仍保留在本地，可以重新开始并调整课程要求。"
  - heading "原因" [level=3] [ref=e272]
  - list [ref=e273]:
    - listitem [ref=e274]:
      - text: 上传的 markdown 被成功解析，生成了
      - strong [ref=e275]: 191 个 chunks
      - text: 和 extraction evidence
    - listitem [ref=e276]:
      - text: 但 extraction evidence 的
      - code [ref=e277]: status
      - text: 是
      - code [ref=e278]: warning
      - text: （解析器产生了非致命警告，但解析本身是成功的）
    - listitem [ref=e279]:
      - code [ref=e280]: source_is_extractable
      - text: 的 fall-through 逻辑（用于
      - code [ref=e281]: extraction_status=registered
      - text: 的 governed-upload 源）只接受
      - code [ref=e282]: status = 'verified'
      - text: 的 extraction evidence
    - listitem [ref=e283]:
      - code [ref=e284]: warning ≠ verified
      - text: ，所以源被判定为"不可提取"，导致
      - code [ref=e285]: SlideBuildError
  - heading "修复" [level=3] [ref=e286]
  - table [ref=e287]:
    - rowgroup [ref=e288]:
      - row [ref=e289]:
        - columnheader "文件" [ref=e290]
        - columnheader "改动" [ref=e291]
    - rowgroup [ref=e292]:
      - row [ref=e293]:
        - cell [ref=e294]:
          - code [ref=e295]: catalog.py
        - cell [ref=e296]:
          - code [ref=e297]: source_is_extractable
          - text: 的 fall-through 查询从
          - code [ref=e298]: status = 'verified'
          - text: 改为
          - code [ref=e299]: status IN ('verified', 'warning')
          - text: ，因为
          - code [ref=e300]: warning
          - text: 表示解析完成只是有非致命警告
      - row [ref=e301]:
        - cell [ref=e302]:
          - code [ref=e303]: personal_orchestrator.py
        - cell [ref=e304]:
          - code [ref=e305]: _failed_phase
          - text: 现在记录
          - code [ref=e306]: error_message
          - text: （实际错误消息），方便调试
  - separator [ref=e307]
  - heading "8. 点击开始授课无反应：401 旧令牌" [level=2] [ref=e308]
  - heading "现象" [level=3] [ref=e309]
  - paragraph [ref=e310]: 点击"开始授课"按钮没有反应，终端持续报 401：
  - code [ref=e312]: GET /v1/personal-courses/.../projection HTTP/1.1" 401 Unauthorized
  - heading "原因" [level=3] [ref=e313]
  - paragraph [ref=e314]:
    - text: 服务器重启后旧的会话令牌失效了，前端
    - code [ref=e315]: sessionStorage
    - text: 里存的还是旧令牌，导致所有请求返回 401。
    - code [ref=e316]: openCourse
    - text: 是 async 函数但没有 catch 错误，所以按钮看起来没反应。
  - heading "修复" [level=3] [ref=e317]
  - table [ref=e318]:
    - rowgroup [ref=e319]:
      - row [ref=e320]:
        - columnheader "文件" [ref=e321]
        - columnheader "改动" [ref=e322]
    - rowgroup [ref=e323]:
      - row [ref=e324]:
        - cell [ref=e325]:
          - code [ref=e326]: helper-session.ts
        - cell [ref=e327]:
          - text: 新增
          - code [ref=e328]: rebootstrapSameOriginSession()
          - text: 导出函数，先清除旧令牌再重新获取同源会话令牌
      - row [ref=e329]:
        - cell [ref=e330]:
          - code [ref=e331]: knowledge-client.ts
        - cell [ref=e332]:
          - code [ref=e333]: KnowledgeClient
          - text: 构造函数新增可选的
          - code [ref=e334]: refreshSession
          - text: 回调。
          - code [ref=e335]: "#fetchJson"
          - text: 收到 401 时自动调用该回调刷新令牌并重试一次请求。
          - code [ref=e336]: "#sessionToken"
          - text: 从
          - code [ref=e337]: readonly
          - text: 改为可变
      - row [ref=e338]:
        - cell [ref=e339]:
          - code [ref=e340]: App.tsx
        - cell [ref=e341]:
          - text: 创建
          - code [ref=e342]: KnowledgeClient
          - text: 时传入
          - code [ref=e343]: rebootstrapSameOriginSession
          - text: 作为刷新回调；
          - code [ref=e344]: openCourse
          - text: 加了 try/catch，失败时弹窗提示
  - separator [ref=e345]
  - heading "9. 401 报错：同源 GET 请求无 Origin 头" [level=2] [ref=e346]
  - heading "现象" [level=3] [ref=e347]
  - paragraph [ref=e348]: 问题 8 的修复生效后（错误从静默变为弹窗提示），但点击"开始授课"仍然报 401：
  - code [ref=e350]: "无法打开课程：本地知识服务暂不可用（HTTP 401: {\"detail\":\"unauthorized\"}）"
  - heading "原因" [level=3] [ref=e351]
  - paragraph [ref=e352]:
    - strong [ref=e353]: 核心矛盾：浏览器对同源 GET 请求不发送 Origin 头
  - paragraph [ref=e354]:
    - text: 后端
    - code [ref=e355]: require_session
    - text: （
    - code [ref=e356]: api.py
    - text: ）的鉴权逻辑要求
    - code [ref=e357]: Origin
    - text: 头必须精确匹配
    - code [ref=e358]: allowed_origin
    - text: ，但浏览器对
    - strong [ref=e359]:
      - text: 同源 GET 请求不发送
      - code [ref=e360]: Origin
      - text: 头
    - text: （Chrome/Firefox/Edge 均如此）：
  - table [ref=e361]:
    - rowgroup [ref=e362]:
      - row [ref=e363]:
        - columnheader "请求类型" [ref=e364]
