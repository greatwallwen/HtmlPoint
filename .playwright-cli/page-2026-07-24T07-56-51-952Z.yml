  - heading "原因" [level=3] [ref=e33]
  - list [ref=e34]:
    - listitem [ref=e35]:
      - strong [ref=e36]: npm.cmd 不在系统 PATH 中
      - text: — Node.js 解压在
      - code [ref=e37]: E:\nodejs\node-v22.18.0-win-x64\
