        - cell [ref=e386]:
          - strong [ref=e387]: GET
        - cell [ref=e388]:
          - strong [ref=e389]: 空
        - cell [ref=e390]:
          - strong [ref=e391]: "401"
  - paragraph [ref=e392]:
    - strong [ref=e393]: 为什么自动刷新重试也失败：
  - list [ref=e394]:
    - listitem [ref=e395]:
      - code [ref=e396]: getPersonalCourseProjection
      - text: （GET）→ 无 Origin → 401
    - listitem [ref=e397]:
      - text: 触发
      - code [ref=e398]: rebootstrapSameOriginSession
      - text: （POST）→ 有 Origin → 成功获取新 token
    - listitem [ref=e399]:
      - text: 用新 token 重试 GET → 仍无 Origin →
      - strong [ref=e400]: 再次 401
  - paragraph [ref=e401]: 无论刷新多少次，GET 请求永远 401。
  - paragraph [ref=e402]:
    - strong [ref=e403]: 代码不一致：
  - paragraph [ref=e404]:
    - code [ref=e405]: session.py
    - text: 的
    - code [ref=e406]: issue_same_origin_token
    - text: 已经接受空 Origin（
    - code [ref=e407]: origin != ""
    - text: ），但
    - code [ref=e408]: api.py
    - text: 的
    - code [ref=e409]: require_session
    - text: 不接受。两者不一致。
  - heading "修复" [level=3] [ref=e410]
  - paragraph [ref=e411]:
    - strong [ref=e412]:
      - text: 文件：
      - code [ref=e413]: platform/helper/course_helper/api.py
  - code [ref=e415]: "# 修改前 if ( origin != runtime.launch_session.allowed_origin or not runtime.launch_session.verify_token(token) ): # 修改后 if ( (origin != runtime.launch_session.allowed_origin and origin != \"\") or not runtime.launch_session.verify_token(token) ):"
  - paragraph [ref=e416]:
    - text: 核心差异：条件从
    - code [ref=e417]: origin != allowed_origin
    - text: 改为
    - code [ref=e418]: (origin != allowed_origin and origin != "")
